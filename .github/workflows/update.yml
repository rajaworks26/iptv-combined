name: Update IPTV Playlist and EPG

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build playlists and EPG channel map
        run: python scripts/build.py

      - name: Install IPTV-org EPG generator
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git /tmp/epg
          cd /tmp/epg
          npm install --no-audit --no-fund

      - name: Generate EPG
        run: |
          cp epg.channels.xml /tmp/epg/channels.xml
          cd /tmp/epg
          npm run grab -- --channels=channels.xml --output="${{ github.workspace }}/combined.xml" --maxConnections=10 --timeout=30000

      - name: Merge FAST guides, prune, compress, measure coverage
        run: |
          python - <<'PY'
          import gzip, json, re, shutil, urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          m3u = Path('combined.m3u').read_text(encoding='utf-8', errors='ignore')
          wanted = set(re.findall(r'tvg-id="([^"]+)"', m3u)) - {''}

          tree = ET.parse('combined.xml')
          root = tree.getroot()
          have = {c.attrib.get('id') for c in root.findall('channel')}

          fast_urls = [
              'https://i.mjh.nz/PlutoTV/ca.xml.gz',
              'https://i.mjh.nz/SamsungTVPlus/ca.xml.gz',
              'https://i.mjh.nz/SamsungTVPlus/in.xml.gz',
              'https://i.mjh.nz/Plex/ca.xml.gz',
              'https://i.mjh.nz/Roku/all.xml.gz',
          ]
          for url in fast_urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  ext = ET.fromstring(gzip.decompress(urllib.request.urlopen(req, timeout=60).read()))
                  added = set()
                  for ch in ext.findall('channel'):
                      cid = ch.attrib.get('id', '')
                      if cid in wanted and cid not in have:
                          root.append(ch)
                          have.add(cid)
                          added.add(cid)
                  for prog in ext.findall('programme'):
                      if prog.attrib.get('channel', '') in added:
                          root.append(prog)
                  print(f'Merged {len(added)} FAST channels from {url}')
              except Exception as exc:
                  print(f'Warning: skipped {url}: {exc}')

          def ts(s):
              try:
                  return datetime.strptime(s.strip(), '%Y%m%d%H%M%S %z')
              except Exception:
                  try:
                      return datetime.strptime(s.strip()[:14], '%Y%m%d%H%M%S').replace(tzinfo=timezone.utc)
                  except Exception:
                      return None

          now = datetime.now(timezone.utc)
          lo, hi = now - timedelta(hours=12), now + timedelta(hours=72)
          for p in list(root.findall('programme')):
              st = ts(p.attrib.get('start', ''))
              en = ts(p.attrib.get('stop', '')) or st
              if (en and en < lo) or (st and st > hi):
                  root.remove(p)

          with_prog = {p.attrib.get('channel') for p in root.findall('programme')}
          covered = wanted & with_prog
          rep = json.loads(Path('report.json').read_text())
          rep['epg_final_covered_ids'] = len(covered)
          rep['epg_final_percent'] = round(100 * len(covered) / max(len(wanted), 1), 1)
          Path('report.json').write_text(json.dumps(rep, indent=2) + '\n')

          tree.write('combined.xml', encoding='utf-8', xml_declaration=True)
          with open('combined.xml', 'rb') as f_in, gzip.open('combined.xml.gz', 'wb', compresslevel=9) as f_out:
              shutil.copyfileobj(f_in, f_out)
          print(rep['epg_final_percent'], '% final EPG coverage')
          PY

      - name: Validate outputs
        run: python scripts/validate.py

      - name: Commit playlists (main branch, small text files only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch -q combined.xml combined.xml.gz epg.channels.xml
          git add .gitignore combined.m3u alternates.m3u language-*.m3u report.json data/
          git diff --cached --quiet || git commit -m "Auto-update playlists and stream history"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish EPG to orphan 'epg' branch (no history growth)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          cp combined.xml.gz "$d/"
          cd "$d"
          git init -q -b epg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combined.xml.gz
          git commit -q -m "EPG $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" epg
