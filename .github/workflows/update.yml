name: Update IPTV Playlist and EPG

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          python -m py_compile scripts/build.py scripts/validate.py scripts/config.py

      - name: Run automated tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build playlists and EPG channel map
        env:
          IPTV_OUTPUT_DIR: ${{ github.workspace }}/build_staging
        run: python scripts/build.py

      - name: Validate staged outputs
        run: python scripts/validate.py --root "${{ github.workspace }}/build_staging"

      - name: Install IPTV-org EPG generator
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git /tmp/epg
          cd /tmp/epg
          npm install --no-audit --no-fund

      - name: Generate EPG
        run: |
          cp build_staging/epg.channels.xml /tmp/epg/channels.xml
          cd /tmp/epg
          npm run grab -- --channels=channels.xml --output="${{ github.workspace }}/combined.xml" --maxConnections=10 --timeout=30000

      - name: Merge FAST guides, prune, compress, measure coverage
        run: |
          python - <<'PY'
          import gzip, json, re, shutil, urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          m3u = Path('build_staging/combined.m3u').read_text(encoding='utf-8', errors='ignore')
          wanted = set(re.findall(r'tvg-id="([^"]+)"', m3u)) - {''}

          tree = ET.parse('combined.xml')
          root = tree.getroot()
          have = {channel.attrib.get('id') for channel in root.findall('channel')}

          fast_urls = [
              'https://i.mjh.nz/PlutoTV/ca.xml.gz',
              'https://i.mjh.nz/SamsungTVPlus/ca.xml.gz',
              'https://i.mjh.nz/SamsungTVPlus/in.xml.gz',
              'https://i.mjh.nz/Plex/ca.xml.gz',
              'https://i.mjh.nz/Roku/all.xml.gz',
          ]
          for url in fast_urls:
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  external = ET.fromstring(gzip.decompress(urllib.request.urlopen(request, timeout=60).read()))
                  added = set()
                  for channel in external.findall('channel'):
                      channel_id = channel.attrib.get('id', '')
                      if channel_id in wanted and channel_id not in have:
                          root.append(channel)
                          have.add(channel_id)
                          added.add(channel_id)
                  for programme in external.findall('programme'):
                      if programme.attrib.get('channel', '') in added:
                          root.append(programme)
                  print(f'Merged {len(added)} FAST channels from {url}')
              except Exception as error:
                  print(f'Warning: skipped {url}: {error}')

          def timestamp(value):
              try:
                  return datetime.strptime(value.strip(), '%Y%m%d%H%M%S %z')
              except Exception:
                  try:
                      return datetime.strptime(value.strip()[:14], '%Y%m%d%H%M%S').replace(tzinfo=timezone.utc)
                  except Exception:
                      return None

          now = datetime.now(timezone.utc)
          lower = now - timedelta(hours=12)
          upper = now + timedelta(hours=72)
          for programme in list(root.findall('programme')):
              start = timestamp(programme.attrib.get('start', ''))
              stop = timestamp(programme.attrib.get('stop', '')) or start
              if (stop and stop < lower) or (start and start > upper):
                  root.remove(programme)

          with_programmes = {programme.attrib.get('channel') for programme in root.findall('programme')}
          covered = wanted & with_programmes
          Path('data').mkdir(exist_ok=True)
          Path('data/epg_active_ids.json').write_text(json.dumps(sorted(covered), separators=(',', ':')) + '\n')

          report = json.loads(Path('build_staging/report.json').read_text())
          report['epg_final_covered_ids'] = len(covered)
          report['epg_final_percent'] = round(100 * len(covered) / max(len(wanted), 1), 1)
          Path('build_staging/report.json').write_text(json.dumps(report, indent=2) + '\n')

          tree.write('combined.xml', encoding='utf-8', xml_declaration=True)
          with open('combined.xml', 'rb') as source, gzip.open('combined.xml.gz', 'wb', compresslevel=9) as target:
              shutil.copyfileobj(source, target)
          print(report['epg_final_percent'], '% final EPG coverage')
          PY

      - name: Promote staged outputs
        run: |
          cp build_staging/combined.m3u build_staging/alternates.m3u build_staging/language-*.m3u .
          cp build_staging/sports.m3u build_staging/news.m3u build_staging/canada.m3u build_staging/usa.m3u .
          cp build_staging/india.m3u build_staging/pakistan.m3u build_staging/movies.m3u build_staging/music.m3u .
          cp build_staging/report.json build_staging/epg.channels.xml .

      - name: Validate final outputs
        run: python scripts/validate.py --root "${{ github.workspace }}"

      - name: Publish validated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch -q combined.xml combined.xml.gz epg.channels.xml top-picks.m3u
          git add .gitignore combined.m3u alternates.m3u language-*.m3u sports.m3u news.m3u canada.m3u usa.m3u india.m3u pakistan.m3u movies.m3u music.m3u channel_numbers.json report.json data/ epg.channels.xml
          git diff --cached --quiet || git commit -m "Auto-update playlists, channel numbering, and stream history"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      - name: Publish EPG to orphan 'epg' branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory=$(mktemp -d)
          cp combined.xml.gz "$directory/"
          cd "$directory"
          git init -q -b epg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combined.xml.gz
          git commit -q -m "EPG $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" epg
