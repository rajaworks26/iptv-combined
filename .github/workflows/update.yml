
name: Update IPTV Playlist and EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      - name: Build combined playlist
        run: |
          python scripts/build.py

      - name: Install IPTV-org EPG generator
        run: |
          git clone --depth 1 \
            https://github.com/iptv-org/epg.git \
            /tmp/iptv-epg
          cd /tmp/iptv-epg
          npm ci

      - name: Generate EPG
        run: |
          cd /tmp/iptv-epg
          npm run grab -- \
            --channels="$GITHUB_WORKSPACE/epg.channels.xml" \
            --output="$GITHUB_WORKSPACE/combined.xml" \
            --days=3

      - name: Validate generated files
        run: |
          python scripts/validate.py

      - name: Publish updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -q -- iptv-epg 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update IPTV playlist and EPG"
            git push
          fi
